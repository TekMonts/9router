name: Sync upstream and publish ai-router

on:
  schedule:
    - cron: "17 3 * * *" # daily 03:17 UTC; skips if upstream unchanged
  workflow_dispatch:

env:
  IMAGE: ghcr.io/tekmonts/ai-router
  UPSTREAM: decolua/9router

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT || github.token }}

      - name: Sync fork with upstream
        id: sync
        run: |
          git config user.name "TekMonts"
          git config user.email "baoquoc.803@gmail.com"
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch upstream master
          BEHIND=$(git rev-list --count HEAD..upstream/master)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          if [ "$BEHIND" -eq 0 ]; then
            echo "No upstream changes"; exit 0
          fi
          git merge --ff-only upstream/master || { echo "ff-only failed — needs manual merge"; exit 1; }
          git push origin master

      - name: Strip NineRemote remnants
        if: steps.sync.outputs.behind != '0'
        run: node scripts/strip-nine-remote.mjs

      - name: Verify playground route exists
        if: steps.sync.outputs.behind != '0'
        run: |
          test -f "src/app/(dashboard)/dashboard/playground/page.js" \
            || { echo "playground page missing"; exit 1; }

      - name: Commit patch
        id: patch
        if: steps.sync.outputs.behind != '0'
        run: |
          if ! git diff --quiet; then
            git add -A
            git commit -m "fix(dashboard): strip NineRemote remnants post-sync"
            git push origin master
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch
        if: steps.sync.outputs.behind != '0'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE }}:latest
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
